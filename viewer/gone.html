        <style>
            @font-face { font-family: "Pretendard"; font-weight: 400; src: local("Pretendard Regular"), url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2) format("woff2"); }
            @font-face { font-family: "Pretendard"; font-weight: 700; src: local("Pretendard Bold"), url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2) format("woff2"); }

            html, body { height: 100%; margin: 0; }

            body {
                font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
                color: #212224;
                letter-spacing: -0.5px;
                -webkit-font-smoothing: antialiased;
                background:
                    radial-gradient(30% 22% at 11% 9%, rgba(255, 188, 198, 0.34) 0%, rgba(255, 188, 198, 0.14) 44%, transparent 78%),
                    radial-gradient(54% 42% at 58% 44%, rgba(255, 182, 203, 0.34) 0%, rgba(255, 182, 203, 0.16) 48%, transparent 80%),
                    radial-gradient(42% 32% at 78% 48%, rgba(247, 165, 222, 0.34) 0%, rgba(247, 165, 222, 0.14) 44%, transparent 78%),
                    radial-gradient(66% 54% at 19% 88%, rgba(161, 182, 252, 0.62) 0%, rgba(161, 182, 252, 0.28) 40%, transparent 76%),
                    radial-gradient(56% 42% at 61% 93%, rgba(151, 162, 247, 0.56) 0%, rgba(151, 162, 247, 0.22) 42%, transparent 76%),
                    radial-gradient(34% 26% at 73% 13%, rgba(255, 220, 174, 0.18) 0%, rgba(255, 220, 174, 0.06) 42%, transparent 78%),
                    linear-gradient(180deg, rgba(255, 249, 247, 0.98) 0%, rgba(252, 241, 247, 0.95) 44%, rgba(245, 239, 255, 0.98) 100%),
                    #fffaf8;
                background-attachment: fixed;
            }

            .gate {
                box-sizing: border-box;
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 20px;
            }

            .card {
                box-sizing: border-box;
                width: 420px;
                max-width: 100%;
                min-height: 400px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 48px 44px;
                text-align: center;
                background: rgba(255, 255, 255, 0.6);
                border-radius: 80px 10px 80px 10px;
            }

            .nc-logo { display: block; width: 200px; height: auto; margin: 0 auto 32px; }

            h1 { margin: 0 0 10px; font-size: 30px; font-weight: 700; line-height: 1.3; }

            .guide { margin: 0; font-size: 15px; line-height: 1.6; color: #707070; }

            .expiry { margin: 6px 0 0; font-size: 14px; line-height: 1.6; color: #222b46; font-weight: 700; }

            form { margin: 28px 0 0; }

            .field { position: relative; margin: 0 0 14px; background: #ffffff; border: 1px solid transparent; border-radius: 4px; }
            .field:focus-within { border-color: #222b46; }

            .field input {
                box-sizing: border-box;
                width: 100%;
                padding: 15px 46px 15px 18px;
                border: 0;
                border-radius: 4px;
                outline: 0;
                background: transparent;
                font-family: inherit;
                font-size: 16px;
                letter-spacing: inherit;
                color: #212224;
            }

            .toggle {
                position: absolute;
                top: 50%;
                right: 6px;
                transform: translateY(-50%);
                width: 36px;
                height: 36px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                border: 0;
                border-radius: 4px;
                background: transparent;
                color: #707070;
                cursor: pointer;
            }

            .submit {
                -webkit-appearance: none;
                appearance: none;
                box-sizing: border-box;
                width: 100%;
                height: 52px;
                padding: 8px 16px;
                border: 0;
                border-radius: 4px;
                background: #222b46;
                color: #ffffff;
                font-family: inherit;
                font-size: 18px;
                font-weight: 700;
                letter-spacing: -0.5px;
                cursor: pointer;
            }
            .submit:hover, .submit:focus-visible { filter: brightness(92%); }
            .submit:disabled { opacity: 0.6; cursor: default; }

            .error { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: #f32b42; font-weight: 700; }

            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

            [hidden] { display: none !important; }

            /* The decrypted document is shown in an isolated frame that fills the window. */
            .document { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #ffffff; }

            @media (max-width: 760px) {
                .nc-logo { width: 168px; margin-bottom: 28px; }
                .card { min-height: 0; padding: 48px 28px 36px; border-radius: 56px 10px 56px 10px; }
                h1 { font-size: 26px; }
            }
        </style>
    </head>
